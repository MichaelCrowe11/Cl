name: CI
on:
  push: { branches: ["main"] }
  pull_request: {}
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .[dev]
      - name: Lint & Type
        run: |
          ruff check .
          mypy clx_mpdet
      - name: Tests
        run: pytest -q
      - name: Build Docker
        run: docker build -t clx-mpdet:ci -f Dockerfile.api .
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: clx-mpdet:ci
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
